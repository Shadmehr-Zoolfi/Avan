name: Build Avan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project files
        run: |
          echo "Gradle files:"
          find . -maxdepth 4 -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \)

      - name: Build APK
        run: |
          chmod +x */gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          elif [ -f */gradlew ]; then
            $(find . -maxdepth 2 -name gradlew -type f | head -1) assembleDebug
          else
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Avan-debug
          path: '**/build/outputs/apk/debug/*.apk'
